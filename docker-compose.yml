
services:

  backend:
    build:
      context: .
      dockerfile: backend/dockerfile.backend

    container_name: supplychain_backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/dockerfile.frontend
    container_name: supplychain_frontend
    ports:
      - "8501:8501"
   
    depends_on:
      - backend
    restart: unless-stopped
